services:
  - type: web
    name: quivr-mempalace-rag
    runtime: python
    region: oregon
    plan: free
    healthCheckPath: /api/health

    # Build the Python API, React frontend, TTS assets, and the isolated
    # AICertify compliance worker. AICertify uses LangChain 1.x, while the
    # application itself uses Quivr's LangChain 0.3 stack, so it must not be
    # installed into the main service environment.
    buildCommand: |
      set -euo pipefail
      cd src/ragb/examples/mempalace_rag_ui
      python -m pip install --upgrade pip
      python -m pip install --editable ../../core
      python -m pip install --editable "../../../../examples/mempalace_quivr[nvidia]"
      python -m pip install --upgrade \
        --index-url https://download.pytorch.org/whl/cpu \
        --extra-index-url https://pypi.org/simple \
        "torch>=2.2,<3" "torchvision>=0.17,<1"
      python -m pip install --requirement requirements.txt

      python -c "from quivr_core import Brain; print('quivr_core import OK')"
      python -c "from agent_rag_governance import RAGGovernor, RAGPolicy; from importlib.metadata import version; print('Agent Governance Toolkit import OK', version('agent-governance-toolkit-core'), version('agent-rag-governance'))"
      python -c "from governance import governance_snapshot; print('RAG governance status:', governance_snapshot())"
      python -c "import langchain_openai, markitdown, olgadoc, sqlite_vec, duckdb; print('Model providers, Olga, MarkItDown, sqlite-vec, and DuckDB import OK')"
      python -c "import docling, onnxruntime, rapidocr, scipy, torch, torchvision; from ocr import _docling_converter; _docling_converter(); print('Docling Slim/RapidOCR CPU converter OK', torch.__version__, torchvision.__version__)"

      # Install AICertify separately because its LangChain 1.x dependency graph
      # is incompatible with the main Quivr service's LangChain 0.3 graph.
      python -m venv .aicertify-venv
      .aicertify-venv/bin/python -m pip install --upgrade pip
      .aicertify-venv/bin/python -m pip install --requirement ../../../../requirements-aicertify.txt

      # AICertify evaluates its bundled Rego policies through the OPA binary.
      curl --fail --location --retry 3 --retry-all-errors \
        https://openpolicyagent.org/downloads/latest/opa_linux_amd64 \
        --output .aicertify-venv/bin/opa
      chmod +x .aicertify-venv/bin/opa
      OPA_PATH="$PWD/.aicertify-venv/bin/opa" .aicertify-venv/bin/python -c "from aicertify import application, regulations; print('AICertify import OK')"
      .aicertify-venv/bin/opa version

      KOKORO_MODELS_DIR=models \
        KOKORO_MODEL_URL=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx \
        KOKORO_MODEL_FILENAME=kokoro-v1.0.int8.onnx \
        KOKORO_VOICES_URL=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin \
        KOKORO_VOICES_FILENAME=voices-v1.0.bin \
        python -c "from app import _ensure_kokoro_models; _ensure_kokoro_models()"

      cd frontend
      npm ci --no-audit --no-fund
      npm run build
      cd ..
      mkdir -p quivr_mempalace_rag_ui/static
      cp -a frontend/dist/. quivr_mempalace_rag_ui/static/

    # Start the FastAPI server; Render injects $PORT automatically
    startCommand: |
      cd src/ragb/examples/mempalace_rag_ui
      uvicorn app:app --host 0.0.0.0 --port $PORT

    # Render sets the PORT env var automatically
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GROQ_API_KEY
        sync: false          # Set this in the Render dashboard — never commit it
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: MICROSOFT_FOUNDRY_API_KEY
        sync: false
      - key: MICROSOFT_FOUNDRY_BASE_URL
        sync: false
      - key: MICROSOFT_FOUNDRY_MODEL
        value: Phi-4-mini-instruct
      - key: DOCSTRANGE_API_KEY
        sync: false
      - key: DOCSTRANGE_FALLBACK_ENABLED
        value: "false"
      - key: DOCLING_OCR_LANG
        value: en
      - key: MICROSOFT_TENANT_ID
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: ADMIN_FALLBACK_ENABLED
        value: "false"
      - key: ADMIN_FALLBACK_TOKEN
        sync: false
      - key: ADMIN_FALLBACK_EMAIL
        value: fallback-admin@local
      - key: LOGFIRE_TOKEN
        sync: false
      - key: LOGFIRE_SEND_TO_LOGFIRE
        value: "true"
      - key: LOGFIRE_SERVICE_NAME
        value: quivr-mempalace-rag
      - key: LOGFIRE_PROJECT_URL
        sync: false
      - key: LOGFIRE_INSTRUMENT_PYDANTIC
        value: "true"
      - key: OBSERVABILITY_CAPTURE_CONTENT
        value: "false"
      - key: AGT_AGENT_ID
        value: mempalace-quivr
      - key: AGT_COLLECTION
        value: quivr-demo
      - key: AGT_ALLOWED_COLLECTIONS
        value: quivr-demo
      - key: AGT_DENIED_COLLECTIONS
        value: ""
      - key: AGT_MAX_RETRIEVALS_PER_MINUTE
        value: "60"
      - key: AGT_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: AGT_CONTENT_POLICIES
        value: block_pii,block_injections
      - key: AGT_AUDIT_ENABLED
        value: "true"
      - key: AGT_ENFORCEMENT_REQUIRED
        value: "false"
      - key: AGT_AUDIT_LOG_PATH
        value: /tmp/agent-rag-audit.jsonl
      - key: AGENT_RAG_AUDIT_SALT
        sync: false
      - key: NVIDIA_API_KEY
        sync: false          # Optional — only needed if using NVIDIA NIM
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_EMBEDDING_MODEL
        value: nvidia/nemotron-3-embed-1b
      - key: NVIDIA_EMBEDDING_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_EMBEDDING_BATCH_SIZE
        value: "50"
      - key: QUIVR_CHUNK_SIZE
        value: "1200"
      - key: QUIVR_CHUNK_OVERLAP
        value: "150"
      - key: MAX_UPLOAD_FILES
        value: "10"
      - key: MAX_UPLOAD_BYTES
        value: "20971520"
      - key: MAX_UPLOAD_TOTAL_BYTES
        value: "52428800"
      - key: MAX_PARSED_DOCUMENT_CHARS
        value: "5000000"
      - key: MAX_PARSED_TOTAL_CHARS
        value: "10000000"
      - key: MEMPALACE_PALACE_PATH
        value: /tmp/.mempalace/palace
      - key: AICERTIFY_ENABLED
        value: "true"
      - key: AICERTIFY_CAPTURE_INTERACTIONS
        value: "false"
      - key: AICERTIFY_PYTHON
        value: .aicertify-venv/bin/python
      - key: AICERTIFY_POLICY
        value: eu_ai_act
      - key: AICERTIFY_REPORT_FORMAT
        value: markdown
      - key: AICERTIFY_REPORT_DIR
        value: /tmp/aicertify-reports
      - key: OPA_PATH
        value: .aicertify-venv/bin/opa
      # Use the smaller model and cache it in the deploy artifact during build.
      - key: KOKORO_MODELS_DIR
        value: models
      - key: KOKORO_MODEL_URL
        value: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
      - key: KOKORO_MODEL_FILENAME
        value: kokoro-v1.0.int8.onnx
      - key: KOKORO_VOICES_URL
        value: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - key: KOKORO_VOICES_FILENAME
        value: voices-v1.0.bin
