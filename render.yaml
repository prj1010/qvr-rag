services:
  - type: web
    name: quivr-mempalace-rag
    runtime: python
    region: oregon
    plan: free
    healthCheckPath: /api/health

    # Build: install the bundled Quivr/MemPalace sources, Python deps, the
    # React frontend, and a small TTS model cache.
    buildCommand: |
      set -e
      cd src/ragb/examples/mempalace_rag_ui
      pip install --upgrade pip
      pip install -e ../../core
      pip install -e "../../../../examples/mempalace_quivr[nvidia]"
      pip install -r requirements.txt
      python -c "from quivr_core import Brain; print('quivr_core import OK')"
      python -c "from agent_rag_governance import RAGGovernor, RAGPolicy; from importlib.metadata import version; print('Agent Governance Toolkit import OK', version('agent-governance-toolkit-core'), version('agent-rag-governance'))"
      python -c "from governance import governance_snapshot; status = governance_snapshot(); assert status['enabled'], status; print('RAG governance runtime OK')"
      python -c "import pymupdf4llm, rapidocr_onnxruntime; print('PyMuPDF4LLM and RapidOCR import OK')"
      KOKORO_MODELS_DIR=models KOKORO_MODEL_URL=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx KOKORO_MODEL_FILENAME=kokoro-v1.0.int8.onnx KOKORO_VOICES_URL=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin KOKORO_VOICES_FILENAME=voices-v1.0.bin python -c "from app import _ensure_kokoro_models; _ensure_kokoro_models()"
      cd frontend
      npm ci
      npm run build
      cd ..
      mkdir -p quivr_mempalace_rag_ui/static
      cp -r frontend/dist/* quivr_mempalace_rag_ui/static/

    # Start the FastAPI server; Render injects $PORT automatically
    startCommand: |
      cd src/ragb/examples/mempalace_rag_ui
      uvicorn app:app --host 0.0.0.0 --port $PORT

    # Render sets the PORT env var automatically
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GROQ_API_KEY
        sync: false          # Set this in the Render dashboard — never commit it
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: MICROSOFT_TENANT_ID
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: ADMIN_FALLBACK_ENABLED
        value: "false"
      - key: ADMIN_FALLBACK_TOKEN
        sync: false
      - key: ADMIN_FALLBACK_EMAIL
        value: fallback-admin@local
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
      - key: OBSERVABILITY_CAPTURE_CONTENT
        value: "false"
      - key: AGT_AGENT_ID
        value: mempalace-quivr
      - key: AGT_COLLECTION
        value: quivr-demo
      - key: AGT_ALLOWED_COLLECTIONS
        value: quivr-demo
      - key: AGT_DENIED_COLLECTIONS
        value: ""
      - key: AGT_MAX_RETRIEVALS_PER_MINUTE
        value: "60"
      - key: AGT_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: AGT_CONTENT_POLICIES
        value: block_pii,block_injections
      - key: AGT_AUDIT_ENABLED
        value: "true"
      - key: AGT_AUDIT_LOG_PATH
        value: /tmp/agent-rag-audit.jsonl
      - key: AGENT_RAG_AUDIT_SALT
        sync: false
      - key: NVIDIA_API_KEY
        sync: false          # Optional — only needed if using NVIDIA NIM
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_EMBEDDING_MODEL
        value: nvidia/nemotron-3-embed-1b
      - key: NVIDIA_EMBEDDING_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_EMBEDDING_BATCH_SIZE
        value: "50"
      - key: QUIVR_CHUNK_SIZE
        value: "1200"
      - key: QUIVR_CHUNK_OVERLAP
        value: "150"
      - key: MEMPALACE_PALACE_PATH
        value: /tmp/.mempalace/palace
      # Use the smaller model and cache it in the deploy artifact during build.
      - key: KOKORO_MODELS_DIR
        value: models
      - key: KOKORO_MODEL_URL
        value: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
      - key: KOKORO_MODEL_FILENAME
        value: kokoro-v1.0.int8.onnx
      - key: KOKORO_VOICES_URL
        value: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - key: KOKORO_VOICES_FILENAME
        value: voices-v1.0.bin
