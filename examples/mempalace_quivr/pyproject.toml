[project]
name = "quivr-mempalace"
version = "0.1.0"
description = "A small memory layer for Quivr projects backed by MemPalace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mempalace>=3.9,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
models = [
    "groq>=0.28",
    "langchain-core>=0.3,<0.4",
    "langchain-groq>=0.3.5,<1",
    "langchain-nvidia-ai-endpoints>=0.1,<1.0.0",
    "langchain-huggingface[full]>=0.2,<1",
    "python-dotenv>=1.0",
]
nvidia = [
    "groq>=0.28",
    "langchain-core>=0.3,<0.4",
    "langchain-groq>=0.3.5,<1",
    "langchain-nvidia-ai-endpoints>=0.1,<1.0.0",
    "python-dotenv>=1.0",
]
huggingface = [
    "langchain-core>=0.3,<0.4",
    "langchain-huggingface[full]>=0.2,<1",
]
ui = [
    "gradio>=5,<7",
]

[project.scripts]
quivr-memory = "quivr_mempalace.cli:main"
quivr-rag-ui = "quivr_mempalace.gradio_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quivr_mempalace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
