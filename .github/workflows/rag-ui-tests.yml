name: RAG UI tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ragb/examples/mempalace_rag_ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip duckdb
      - name: Run workspace memory tests
        run: python -m unittest tests.test_memory_search tests.test_context_policy tests.test_memory_store tests.test_model_catalog tests.test_prompts
