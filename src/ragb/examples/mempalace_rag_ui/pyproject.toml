[project]
name = "quivr-mempalace-rag-ui"
version = "0.2.0"
description = "A React and FastAPI RAG application combining Quivr document search with MemPalace memory"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Gaurav Sarma"},
]
dependencies = [
    "quivr-core>=0.0.33,<0.1",
    "quivr-mempalace>=0.1.0",
    "agent-governance-toolkit-core[full] @ git+https://github.com/prj1010/agent-governance-toolkit.git@359a2332f57d9000924baba269ed24e4e15ad8b0#subdirectory=agent-governance-python/agent-governance-toolkit-core ; sys_platform == 'linux'",
    "agent-rag-governance @ git+https://github.com/prj1010/agent-governance-toolkit.git@359a2332f57d9000924baba269ed24e4e15ad8b0#subdirectory=agent-governance-python/agent-rag-governance",
    "fastapi>=0.115,<1",
    "authlib>=1.3,<2",
    "itsdangerous>=2.2,<3",
    "kokoro-onnx>=0.6.1,<0.7",
    "langchain-core>=0.3,<0.4",
    "langchain-text-splitters>=0.3,<0.4",
    "langchain-groq>=0.3.5,<1",
    "langchain-nvidia-ai-endpoints>=0.3.19,<1",
    "langfuse>=2.57,<3",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "packaging>=23.2,<25",
    "markitdown[pdf,docx]>=0.1,<1",
    "docling-slim[format-pdf,feat-ocr-rapidocr-onnx]>=2.121,<3",
    "scipy>=1.6,<2",
    "rtree>=1.3,<2",
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "sqlite-vec>=0.1.9,<0.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20,<1",
    "soundfile>=0.12,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
quivr-mempalace-rag-ui = "app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "admin_auth", "observability", "governance", "ocr"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["quivr_mempalace_rag_ui*"]

[tool.setuptools.package-data]
quivr_mempalace_rag_ui = ["static/*", "static/assets/*"]

[tool.uv.sources]
quivr-core = { path = "../../core", editable = true }
quivr-mempalace = { path = "../../../../examples/mempalace_quivr", editable = true }
